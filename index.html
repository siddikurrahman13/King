<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Private Place</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f5f5f5; display: flex; justify-content: center; height: 100vh; }
    .app-container { width: 100%; max-width: 480px; background: #fff; display: flex; flex-direction: column; height: 100%; position: relative; }
    
    /* Login Screen */
    .auth-screen { padding: 30px; display: flex; flex-direction: column; justify-content: center; height: 100%; background: #fff; text-align: center; }
    .auth-screen h2 { color: #ff3b6c; margin-bottom: 20px; }
    .auth-screen input, .auth-screen select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; outline: none; }
    .auth-screen button { width: 100%; padding: 12px; background: #ff3b6c; color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; }
    
    /* Chat Header */
    .header { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
    .title-area { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #ff3b6c; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    
    /* Chat Area */
    .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fafafa; }
    .message { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .received { background: #ffffff; align-self: flex-start; border: 1px solid #eee; border-bottom-left-radius: 4px; }
    .sent { background: #ff3b6c; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .sender-name { font-size: 10px; opacity: 0.7; margin-bottom: 3px; }
    .time { font-size: 9px; opacity: 0.6; text-align: right; margin-top: 4px; }
    
    /* Input Area */
    .input-area { padding: 10px 15px; display: flex; gap: 10px; border-top: 1px solid #eee; background: white; }
    .input-area input { flex: 1; padding: 10px 15px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
    .input-area button { background: #ff3b6c; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-weight: bold; cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Auth Screen -->
  <div id="authScreen" class="auth-screen">
    <h2>Our Private Place ❤️</h2>
    <select id="userRole">
      <option value="Siddik">I am Siddik</option>
      <option value="Suma">I am Suma</option>
    </select>
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">
    <button onclick="handleAuth()">Login / Register</button>
  </div>

  <!-- Chat Screen -->
  <div id="chatScreen" class="hidden" style="display:flex; flex-direction:column; height:100%;">
    <div class="header">
      <div class="title-area">
        <div class="avatar">❤️</div>
        <div>
          <h3 style="font-size: 16px;">Our Private Place</h3>
          <small style="color: #666;">Just Siddik & Suma</small>
        </div>
      </div>
      <button onclick="logout()" style="border:none; background:none; color:#888; cursor:pointer;">Logout</button>
    </div>

    <div id="chatBox" class="chat-box"></div>

    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMsg()">
      <button onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Your Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCQoGzYEWDIssMmdFkVTR...", // Your API Key from screenshot
    authDomain: "our-private-place.firebaseapp.com",
    projectId: "our-private-place",
    storageBucket: "our-private-place.appspot.com",
    messagingSenderId: "684351201078",
    appId: "1:684351201078:web:f0e6d9f46..."
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let currentUserRole = "";

  window.handleAuth = async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    currentUserRole = document.getElementById('userRole').value;

    if(!email || !password) return alert("Email & Password required!");

    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      if(err.code === 'auth/user-not-found') {
        await createUserWithEmailAndPassword(auth, email, password);
      } else {
        alert(err.message);
      }
    }
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('chatScreen').classList.remove('hidden');
      loadMessages();
    } else {
      document.getElementById('authScreen').classList.remove('hidden');
      document.getElementById('chatScreen').classList.add('hidden');
    }
  });

  window.sendMsg = () => {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if(!text) return;

    const role = currentUserRole || "User";
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    push(ref(db, 'messages'), {
      sender: role,
      text: text,
      time: time
    });

    input.value = "";
  };

  function loadMessages() {
    const chatBox = document.getElementById('chatBox');
    chatBox.innerHTML = "";
    
    onChildAdded(ref(db, 'messages'), (snapshot) => {
      const msg = snapshot.val();
      const isMe = msg.sender === currentUserRole;

      const div = document.createElement('div');
      div.className = `message ${isMe ? 'sent' : 'received'}`;
      div.innerHTML = `
        <div class="sender-name">${msg.sender}</div>
        <div>${msg.text}</div>
        <div class="time">${msg.time}</div>
      `;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  }

  window.logout = () => signOut(auth);
</script>
</body>
</html>
