<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Private Place</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #fcfbfe;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
        }

        /* Top Title Bar */
        .title-bar {
            padding: 16px 20px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .title-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #f472b6, #ec4899);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.2);
        }

        .app-title h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1f2937;
        }

        .app-title p {
            font-size: 13px;
            color: #9ca3af;
        }

        /* User Status Bar */
        .user-status-bar {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #f3f4f6;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 15px;
        }

        .siddik-bg { background: #6366f1; }
        .suma-bg { background: #f43f5e; }

        .user-meta .u-name {
            font-size: 14px;
            font-weight: 600;
            color: #111827;
        }

        .user-meta .u-status {
            font-size: 11px;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
        }

        .heart-divider {
            color: #f43f5e;
            font-size: 14px;
        }

        /* Chat Body */
        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #faf9fc;
        }

        .date-badge {
            align-self: center;
            background: #f3e8ff;
            color: #a855f7;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .message-group {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .message-group.suma { align-self: flex-start; }
        .message-group.siddik { align-self: flex-end; }

        .sender-name {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .siddik .sender-name { text-align: right; }

        .bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
        }

        .suma .bubble {
            background: #f3f4f6;
            color: #1f2937;
            border-top-left-radius: 4px;
        }

        .siddik .bubble {
            background: #f43f5e;
            color: white;
            border-top-right-radius: 4px;
        }

        .time-stamp {
            font-size: 10px;
            margin-top: 4px;
            opacity: 0.7;
            display: block;
            text-align: right;
        }

        /* Input Area */
        .input-area {
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            border-top: 1px solid #f3f4f6;
        }

        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid #e5e7eb;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
            color: #374151;
            background: #f9fafb;
        }

        .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f472b6, #ec4899);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(244, 114, 182, 0.3);
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Title -->
    <div class="title-bar">
        <div class="title-left">
            <div class="app-icon">♥</div>
            <div class="app-title">
                <h2>Our Private Place</h2>
                <p>Just Siddik & Suma</p>
            </div>
        </div>
    </div>

    <!-- Status -->
    <div class="user-status-bar">
        <div class="user-profile">
            <div class="avatar-circle siddik-bg">S</div>
            <div class="user-meta">
                <div class="u-name">Siddik</div>
                <div class="u-status"><span class="dot"></span> Private space</div>
            </div>
        </div>

        <div class="heart-divider">♥</div>

        <div class="user-profile">
            <div class="user-meta" style="text-align: right;">
                <div class="u-name">Suma</div>
                <div class="u-status" style="justify-content: flex-end;"><span class="dot"></span> Private space</div>
            </div>
            <div class="avatar-circle suma-bg">S</div>
        </div>
    </div>

    <!-- Chat Body -->
    <div class="chat-body" id="chatBody">
        <div class="date-badge">Today</div>

        <div class="message-group suma">
            <span class="sender-name">Suma</span>
            <div class="bubble">
                Welcome to our little private place ❤️
                <span class="time-stamp">12:00</span>
            </div>
        </div>

        <div class="message-group siddik">
            <span class="sender-name">Siddik</span>
            <div class="bubble">
                Only ours. No one else belongs here. ❤️
                <span class="time-stamp">12:01</span>
            </div>
        </div>

        <div class="message-group suma">
            <span class="sender-name">Suma</span>
            <div class="bubble">
                Then let's fill it with beautiful memories. ✨
                <span class="time-stamp">12:02</span>
            </div>
        </div>
    </div>

    <!-- Input Box -->
    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Type a message...">
        <button class="send-btn" onclick="sendMsg()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<script>
    function sendMsg() {
        const input = document.getElementById('msgInput');
        const chatBody = document.getElementById('chatBody');
        if(input.value.trim() === '') return;

        const msgGroup = document.createElement('div');
        msgGroup.className = 'message-group siddik';
        msgGroup.innerHTML = `
            <span class="sender-name">Siddik</span>
            <div class="bubble">
                ${input.value}
                <span class="time-stamp">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
            </div>
        `;
        chatBody.appendChild(msgGroup);
        input.value = '';
        chatBody.scrollTop = chatBody.scrollHeight;
    }
</script>

</body>
</html>
